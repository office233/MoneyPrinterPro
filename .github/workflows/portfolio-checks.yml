name: Portfolio checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check portfolio documentation
        run: |
          test -f README.md
          test -f docs/PORTFOLIO_POSITIONING.md
          test -f docs/REVIEWER_NOTES.md
